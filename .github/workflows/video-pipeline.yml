name: Video Pipeline

# Turns approved note article drafts into YouTube video plans (script, scenes,
# YouTube metadata) plus the scene stills. Narration is OFF by default because
# TTS for a 5-minute video is both slow and billable — turn it on manually, or
# generate it from /videos/[id]. The final encode always happens in the browser
# at /videos/[id]/studio, and uploading to YouTube stays manual.
# See docs/VIDEO_PIPELINE.md.
#
# Required repository secrets:
#   APP_URL      e.g. https://japandi-poster-studio.onrender.com (no trailing slash)
#   CRON_SECRET  same value as the CRON_SECRET env var on the server

on:
  schedule:
    - cron: "30 12 * * 1,4" # Mon & Thu 12:30 UTC (21:30 JST), after articles/posters
  workflow_dispatch:
    inputs:
      count:
        description: "videos to plan (1-3)"
        required: false
        default: "1"
      format:
        description: "long (16:9) or short (9:16)"
        required: false
        default: "long"
      visualStyle:
        description: "japandi, aizuri, photo, sumi, flat"
        required: false
        default: "japandi"
      narration:
        description: "also generate TTS narration (true/false) — slow and billable"
        required: false
        default: "false"

jobs:
  run-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger video pipeline
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          COUNT: ${{ inputs.count || '1' }}
          FORMAT: ${{ inputs.format || 'long' }}
          VISUAL_STYLE: ${{ inputs.visualStyle || 'japandi' }}
          NARRATION: ${{ inputs.narration || 'false' }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets are not set; skipping."
            exit 0
          fi
          body="{\"count\": ${COUNT}, \"format\": \"${FORMAT}\", \"visualStyle\": \"${VISUAL_STYLE}\", \"narration\": ${NARRATION}}"
          echo "POST ${APP_URL}/api/cron/videos ${body}"
          curl --fail-with-body -sS -X POST "${APP_URL}/api/cron/videos" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "${body}"
