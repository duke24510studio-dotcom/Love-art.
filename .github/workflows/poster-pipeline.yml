name: Poster Pipeline

# Generates original Hokusai-style aizuri-e (indigo ukiyo-e) poster images
# once a day (default 3, mostly portrait wall art with 1-in-3 landscape for
# YouTube thumbnails/banners and EC hero images). Images only — approval/
# export stays human-reviewed at /posters. See docs/ARTICLE_PIPELINE.md for
# the shared cron/secret setup.
#
# One poster per HTTP request: even with UPSCALE_SCALE=2 (see render.yaml),
# a single request generating 3 posters back-to-back (3x gpt-image-1 calls +
# 3x sharp upscales + 3x Postgres image writes) was reproduced 502ing mid-
# request on the free plan — confirmed live on 2026-07-29 after the
# UPSCALE_SCALE=2 and Postgres-connection-keepalive fixes were already in
# place, so the combined per-request work was still too much. Splitting into
# one call per poster keeps each request small and means partial progress
# (earlier posters) is saved even if a later call fails.
#
# Even split into 1-per-request, a 502 was reproduced on the 2nd call — the
# free-tier instance had just crashed/OOM'd on that call, and Render was
# still restarting when the 3rd call landed immediately after (also 502).
# One retry with a cooldown gives Render time to finish restarting before
# giving up on that poster. If 502s persist, consider lowering
# POSTER_IMAGE_QUALITY (e.g. to "medium") to shrink the base image and cut
# memory pressure further.
#
# DAILY SCHEDULE IS OFF (2026-07-30). Every scheduled/manual run since
# 2026-07-29 failed on the free plan — the 502s above kept recurring even
# 1-per-request-with-retry, and run #20 hung for 5h29m before the job was
# cut off. Rather than burn OpenAI spend and Actions minutes on runs that
# don't produce posters, the cron trigger is removed; only manual
# workflow_dispatch remains. Re-add the `schedule:` block below once the
# instance can actually finish a poster (lower POSTER_IMAGE_QUALITY, or
# upgrade off the free 512MB plan):
#   schedule:
#     - cron: "15 12 * * *" # daily at 12:15 UTC (21:15 JST)
#
# Required repository secrets:
#   APP_URL      e.g. https://japandi-poster-studio.onrender.com (no trailing slash)
#   CRON_SECRET  same value as the CRON_SECRET env var on the server

on:
  workflow_dispatch:
    inputs:
      count:
        description: "posters to generate (1-6)"
        required: false
        default: "3"
      orientation:
        description: "portrait, landscape, or mixed (1-in-3 landscape)"
        required: false
        default: "mixed"

jobs:
  run-posters:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger poster pipeline (one request per poster)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          COUNT: ${{ inputs.count || '3' }}
          ORIENTATION_INPUT: ${{ inputs.orientation || 'mixed' }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets are not set; skipping."
            exit 0
          fi

          status=0
          for i in $(seq 0 $((COUNT - 1))); do
            if [ "$ORIENTATION_INPUT" = "mixed" ]; then
              # Mirror the server's 1-in-3-landscape rule across this run.
              if [ $((i % 3)) -eq 2 ]; then orientation="landscape"; else orientation="portrait"; fi
            else
              orientation="$ORIENTATION_INPUT"
            fi

            body="{\"count\": 1, \"orientation\": \"${orientation}\"}"
            echo "POST ${APP_URL}/api/cron/posters ${body}"
            # --max-time: run #20 hung for 5h29m on a request that never
            # returned, so never let a single call block the job indefinitely.
            if ! curl --fail-with-body -sS --max-time 600 -X POST "${APP_URL}/api/cron/posters" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              -d "${body}"; then
              echo
              echo "First attempt failed — waiting 45s for the instance to recover, then retrying once..."
              sleep 45
              curl --fail-with-body -sS -X POST "${APP_URL}/api/cron/posters" \
                -H "Authorization: Bearer ${CRON_SECRET}" \
                -H "Content-Type: application/json" \
                -d "${body}" || status=1
            fi
            echo
            # Brief cooldown between posters even on success, so the next
            # request doesn't land while memory from this one is still
            # being reclaimed.
            sleep 10
          done
          exit $status
